plugins { id 'java-library' }
group = 'io.github.tianiste'
version = rootProject.mod_version
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
    api 'com.google.code.gson:gson:2.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.register('extractFixture', JavaExec) {
    description = 'Regenerates the sanitized test fixture from the private service-data snapshot.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.FixtureExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractIcons', JavaExec) {
    description = 'Regenerates the mod item icon table from the official Hypixel items resource.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.IconExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractCatalog', JavaExec) {
    description = 'Regenerates the mining item catalog from the official Hypixel items resource.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.CatalogExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractRecipes', JavaExec) {
    description = 'Regenerates the crafting and forge recipe table from the NotEnoughUpdates repository (MIT).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.RecipeExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractNeu', JavaExec) {
    description = 'Regenerates the mining reforge table from the NotEnoughUpdates repository (MIT).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.NeuExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('exportPriceIds', JavaExec) {
    description = 'Writes the price IDs the mod reads, for the hosted price bundle (pass -PpriceIdsOut=<file>).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.PriceIdsExporter'
    workingDir = rootProject.projectDir
    args = [project.findProperty('priceIdsOut') ?: 'build/price-ids.json']
}
jar { from(rootProject.file('LICENSE')) { rename { 'LICENSE_skyprogression-core' } } }
