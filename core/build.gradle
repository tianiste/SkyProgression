plugins { id 'java-library' }
group = 'io.github.tianiste'
version = '0.3.0'
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
dependencies {
    api 'com.google.code.gson:gson:2.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.register('extractFixture', JavaExec) {
    description = 'Regenerates the sanitized test fixture from the private service-data snapshot.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.FixtureExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractIcons', JavaExec) {
    description = 'Regenerates the mod item icon table from the official Hypixel items resource.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.IconExtractor'
    workingDir = rootProject.projectDir
}

tasks.register('extractCatalog', JavaExec) {
    description = 'Regenerates the mining item catalog from the official Hypixel items resource.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tianiste.skyprogression.core.CatalogExtractor'
    workingDir = rootProject.projectDir
}
