name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build :core:test :service:distZip
      - uses: actions/upload-artifact@v4
        with:
          name: SkyProgression
          path: |
            build/libs/*.jar
            service/build/distributions/*.zip
