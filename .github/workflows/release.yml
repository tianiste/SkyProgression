name: Release
# Every push to main (including merged pull requests) checks mod_version in gradle.properties. A version without a
# release yet is built and published as v<mod_version>; otherwise nothing happens. To release, bump mod_version and add
# a "## <version>" section to CHANGELOG.md in the same change.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          test -n "$version" && test -n "$minecraft" || { echo "mod_version or minecraft_version missing"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFT=$minecraft" >> "$GITHUB_ENV"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "Publishing v$version for Minecraft $minecraft."
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi
      - name: Release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md; add one to release this version."; exit 1; }
      - uses: actions/setup-java@v4
        if: env.PUBLISH == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: env.PUBLISH == 'true'
      - name: Build
        if: env.PUBLISH == 'true'
        run: |
          chmod +x gradlew
          ./gradlew build :service:distZip
          echo "JAR=build/libs/skyprogression-$VERSION+$MINECRAFT.jar" >> "$GITHUB_ENV"
          echo "ZIP=service/build/distributions/service-$VERSION.zip" >> "$GITHUB_ENV"
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "SkyProgression $VERSION for Minecraft $MINECRAFT" \
            --notes-file notes.md "$JAR" "$ZIP"
      # Optional: runs only once the repository has a MODRINTH_TOKEN secret and a MODRINTH_PROJECT_ID variable.
      - name: Publish to Modrinth
        if: env.PUBLISH == 'true' && env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ env.JAR }}
          name: SkyProgression ${{ env.VERSION }} for Minecraft ${{ env.MINECRAFT }}
          version: ${{ env.VERSION }}+${{ env.MINECRAFT }}
          version-type: release
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ env.MINECRAFT }}
          java: 25
          dependencies: fabric-api(required)
