name: Release
# Every push to main (including merged pull requests) checks mod_version in gradle.properties. A version without a
# release yet is built for every Minecraft target in versions/ and published as v<mod_version> with one jar per target;
# otherwise nothing happens. To release, bump mod_version and add a "## <version>" section to CHANGELOG.md in the same
# change.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      targets: ${{ steps.build.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          test -n "$version" || { echo "mod_version missing"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.publish == 'true'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md; add one to release this version."; exit 1; }
      - uses: actions/setup-java@v4
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.publish == 'true'
      - name: Build every Minecraft target
        id: build
        if: steps.check.outputs.publish == 'true'
        run: |
          chmod +x gradlew
          mkdir dist
          targets='[]'
          for file in versions/*.properties; do
            target=$(basename "$file" .properties)
            ./gradlew build -Pmc_target="$target"
            # "<mod version>+<label>|<game versions, comma separated>"
            line=$(./gradlew -q printTarget -Pmc_target="$target" | tail -n 1)
            full=${line%%|*}
            games=${line#*|}
            cp "build/libs/skyprogression-$full.jar" dist/
            targets=$(jq -c --arg jar "skyprogression-$full.jar" --arg version "$full" --arg games "$games" \
              '. + [{jar: $jar, version: $version, games: $games}]' <<< "$targets")
          done
          ./gradlew :service:distZip
          cp "service/build/distributions/service-$VERSION.zip" dist/
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          ls dist
      - name: Publish the GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "SkyProgression $VERSION" \
            --notes-file notes.md dist/*
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          name: release
          path: |
            dist/*.jar
            notes.md
  # Optional: one Modrinth version per jar, tagged with its exact game versions. Runs only once the repository has a
  # MODRINTH_PROJECT_ID variable and a MODRINTH_TOKEN secret.
  modrinth:
    needs: release
    if: needs.release.outputs.publish == 'true' && vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.release.outputs.targets) }}
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Game versions, one per line
        run: echo "${{ matrix.games }}" | tr ',' '\n' > games.txt && { echo 'GAMES<<EOF'; cat games.txt; echo EOF; } >> "$GITHUB_ENV"
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/${{ matrix.jar }}
          name: SkyProgression ${{ matrix.version }}
          version: ${{ matrix.version }}
          version-type: release
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ env.GAMES }}
          java: 25
          dependencies: fabric-api(required)
